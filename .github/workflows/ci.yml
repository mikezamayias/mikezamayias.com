name: CI

on:
    pull_request:
        branches: [dev, prod]
    push:
        branches: [dev]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# Runtime secrets sourced from the SOPS-encrypted file at
# `.env.shared.sops.yaml` (encrypted with the age recipient declared
# in `.sops.yaml`). The age private key lives in the `SOPS_AGE_KEY`
# repo secret, scoped per step to only the steps that decrypt.
# Replaces the prior Infisical-Universal-Auth flow.

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup toolchain
              uses: ./.github/actions/setup-bun

            - name: ESLint
              run: bun run lint

            - name: Prettier Check
              run: bunx prettier --check .

    typecheck:
        name: Type Check
        runs-on: ubuntu-24.04
        # Needs SOPS_AGE_KEY, which fork PRs don't get.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup toolchain
              uses: ./.github/actions/setup-bun

            - name: Install SOPS
              run: |
                  curl -fsSL -o /tmp/sops.deb https://github.com/getsops/sops/releases/download/v3.13.3/sops_3.13.3_amd64.deb
                  sudo dpkg -i /tmp/sops.deb
                  sops --version

            - name: Generate content snapshot
              # `server/api/content/*` statically imports content/*.json, which are
              # gitignored build artifacts. Without them typecheck fails with TS2307.
              # This passed on the old self-hosted runner only because `clean: false`
              # left a previous build's files in the working tree.
              run: |
                  set -a
                  source <(sops -d --output-type dotenv .env.shared.sops.yaml)
                  set +a
                  bun run snapshot
              env:
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

            - name: Type Check
              run: bunx nuxi typecheck

    test:
        name: Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup toolchain
              uses: ./.github/actions/setup-bun

            - name: Run Tests with Coverage
              run: bun run test:coverage -- --reporter=verbose

            - name: Upload Coverage Artifact
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v5
              with:
                  name: coverage
                  path: coverage/
                  retention-days: 7
                  if-no-files-found: warn

    rules:
        name: Firestore Rules
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup toolchain
              uses: ./.github/actions/setup-bun

            - name: Set up JDK for the Firestore emulator
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Run Firestore Rules Tests
              run: bun run test:rules

    build:
        name: Build
        runs-on: ubuntu-24.04
        # Needs SOPS_AGE_KEY, which fork PRs don't get.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup toolchain
              uses: ./.github/actions/setup-bun

            - name: Install SOPS
              run: |
                  curl -fsSL -o /tmp/sops.deb https://github.com/getsops/sops/releases/download/v3.13.3/sops_3.13.3_amd64.deb
                  sudo dpkg -i /tmp/sops.deb
                  sops --version

            - name: Build for SSR
              # SOPS decrypts `.env.shared.sops.yaml` to a dotenv-format
              # stream, which is `source`d into the build shell so
              # `bun run build` picks up every NUXT_PUBLIC_* / SENTRY_*
              # variable. The decrypted file never touches disk —
              # process substitution `<(...)` pipes it directly.
              # NUXT_PUBLIC_APP_ENV stays an explicit override so PR
              # preview builds gate Sentry ingestion off (see
              # sentry.{server,client}.config.ts).
              run: |
                  set -a
                  source <(sops -d --output-type dotenv .env.shared.sops.yaml)
                  set +a
                  bun run build
              env:
                  NUXT_PUBLIC_APP_ENV: staging
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

            - name: Verify admin shells
              run: |
                  set -euo pipefail
                  # Every prerendered admin route must be a real SPA shell. A middleware
                  # redirect during prerender produces a 98-byte meta-refresh stub instead,
                  # which bounces signed-in admins before hydration. Caught here, not in prod.
                  stubs=0
                  for f in $(find .output/public/admin -name index.html); do
                    if ! grep -q 'id="__nuxt"' "$f" || [ "$(wc -c <"$f")" -lt 10000 ]; then
                      echo "STUB: $f ($(wc -c <"$f") bytes)"; stubs=$((stubs+1))
                    fi
                  done
                  [ "$stubs" -eq 0 ] || { echo "$stubs admin shell(s) are redirect stubs"; exit 1; }
                  echo "$(find .output/public/admin -name index.html | wc -l) admin shells verified"

            - name: Upload Build Artifact
              continue-on-error: true
              uses: actions/upload-artifact@v5
              with:
                  name: build-output
                  path: .output
                  include-hidden-files: true
                  retention-days: 1
                  if-no-files-found: warn

    lighthouse:
        name: Lighthouse Audit
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        # Audits this PR's Firebase preview channel. Every public page is
        # prerendered, so the preview serves the same static HTML that the
        # Cloudflare Worker serves in production. There is no fallback URL:
        # if the preview isn't reachable the job fails, rather than
        # auditing some other site and reporting green.
        needs: preview
        if: github.event_name == 'pull_request' && needs.preview.outputs.preview_url != ''
        # Write scopes for the PR comment and the upload check; the
        # workflow-level `permissions:` block is read-only.
        permissions:
            contents: read
            pull-requests: write
            checks: write
        env:
            PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Wait for the preview channel
              run: |
                  echo "Waiting for $PREVIEW_URL"
                  for attempt in $(seq 1 36); do
                    code=$(curl -sS -o /dev/null -w "%{http_code}" "$PREVIEW_URL/" || echo "000")
                    if [ "$code" = "200" ]; then
                      echo "Preview ready after attempt $attempt"
                      exit 0
                    fi
                    sleep 5
                  done
                  echo "::error::Preview not reachable: $PREVIEW_URL (last HTTP $code)"
                  exit 1

            - name: List pages to audit
              id: urls
              run: |
                  # One of each page type. Add a path here when a new kind of
                  # page ships.
                  {
                    echo "list<<URLS_EOF"
                    for path in / /work /writing /writing/hello-world /about /contact; do
                      echo "${PREVIEW_URL%/}$path"
                    done
                    echo "URLS_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Run Lighthouse
              id: lighthouse
              uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
              with:
                  # `lighthouserc.json` has no `collect.url`; CI passes the
                  # URLs here, and local runs pass their own, e.g.
                  #   `lhci autorun --collect.url=http://localhost:3000`.
                  urls: ${{ steps.urls.outputs.list }}
                  configPath: ./lighthouserc.json
                  # Full reports: as a workflow artifact, and as public links
                  # (kept 7 days) for the PR comment. The pages are public.
                  uploadArtifacts: true
                  temporaryPublicStorage: true

            # Runs even when an assertion failed, so the comment says why.
            - name: Comment scores on the PR
              if: always() && steps.lighthouse.outputs.manifest != ''
              uses: actions/github-script@v9
              env:
                  MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
                  LINKS: ${{ steps.lighthouse.outputs.links }}
                  ASSERTIONS: ${{ steps.lighthouse.outputs.assertionResults }}
              with:
                  script: |
                      const parse = (s, fallback) => { try { return JSON.parse(s || ""); } catch { return fallback; } };
                      const manifest = parse(process.env.MANIFEST, []);
                      const links = parse(process.env.LINKS, {});
                      const assertions = parse(process.env.ASSERTIONS, []);
                      const base = process.env.PREVIEW_URL.replace(/\/$/, "");

                      const cell = (s) => {
                          const n = Math.round(s * 100);
                          return `${s >= 0.9 ? "🟢" : s >= 0.5 ? "🟠" : "🔴"} ${n}`;
                      };
                      const rows = manifest
                          .filter((r) => r.isRepresentativeRun)
                          .map((r) => {
                              const s = r.summary;
                              const path = r.url.replace(base, "") || "/";
                              const page = links[r.url] ? `[\`${path}\`](${links[r.url]})` : `\`${path}\``;
                              return `| ${page} | ${cell(s.performance)} | ${cell(s.accessibility)} | ${cell(s["best-practices"])} | ${cell(s.seo)} |`;
                          });

                      const failed = assertions.filter((a) => a.level === "error");
                      const warned = assertions.filter((a) => a.level === "warn");
                      const describe = (a) => `- \`${a.url.replace(base, "") || "/"}\` ${a.auditId}: expected ${a.operator} ${a.expected}, got ${typeof a.actual === "number" ? Math.round(a.actual * 1000) / 1000 : a.actual}`;

                      const marker = "<!-- lighthouse-report -->";
                      const body = [
                          marker,
                          "## Lighthouse",
                          "",
                          `Mobile, median of 3 runs, on the preview for ${context.payload.pull_request.head.sha.slice(0, 7)}. Page links open the full report.`,
                          "",
                          "| Page | Performance | Accessibility | Best practices | SEO |",
                          "| --- | --- | --- | --- | --- |",
                          ...rows,
                          "",
                          failed.length ? `**${failed.length} failing ${failed.length === 1 ? "check" : "checks"}**\n\n${failed.map(describe).join("\n")}` : "All required checks pass.",
                          warned.length ? `\n<details><summary>${warned.length} ${warned.length === 1 ? "warning" : "warnings"}</summary>\n\n${warned.map(describe).join("\n")}\n\n</details>` : "",
                      ].join("\n");

                      // One comment per PR, updated on every push.
                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
                      const existing = comments.find((c) => c.body?.startsWith(marker));
                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      } else {
                          await github.rest.issues.createComment({ owner, repo, issue_number, body });
                      }

    a11y:
        name: Accessibility (axe-core)
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        needs: build
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Download Build Artifact
              id: build-artifact
              continue-on-error: true
              uses: actions/download-artifact@v5
              with:
                  name: build-output
                  path: .output

            - name: Setup toolchain
              uses: ./.github/actions/setup-bun

            - name: Install SOPS
              run: |
                  curl -fsSL -o /tmp/sops.deb https://github.com/getsops/sops/releases/download/v3.13.3/sops_3.13.3_amd64.deb
                  sudo dpkg -i /tmp/sops.deb
                  sops --version

            - name: Build static output (artifact fallback)
              if: steps.build-artifact.outcome != 'success'
              run: |
                  set -a
                  source <(sops -d --output-type dotenv .env.shared.sops.yaml)
                  set +a
                  bun run build
              env:
                  NUXT_PUBLIC_APP_ENV: staging
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

            # Serve the prerendered static output (the same dist dir
            # Lighthouse uses via `staticDistDir`). `nuxt preview` is
            # not implemented for the firebase Nitro preset, so we
            # cannot boot the SSR runtime here. axe-core is therefore
            # scoped to prerendered routes only (`/`, `/terms`, and one
            # privacy page). SSR routes (/work, /writing, /about,
            # /contact) are covered manually until a firebase-emulator
            # job lands in a later sweep.
            - name: Start static preview server
              # Pick a free loopback port and force serve to use it. Without
              # --no-port-switching, serve silently falls back to a random port
              # when 3000 is occupied, while axe may still audit a stale
              # process on localhost:3000.
              run: |
                  A11Y_PORT=$(node -e "const net = require('node:net'); const server = net.createServer(); server.listen(0, '127.0.0.1', () => { console.log(server.address().port); server.close(); });")
                  A11Y_BASE_URL="http://127.0.0.1:${A11Y_PORT}"
                  echo "A11Y_BASE_URL=${A11Y_BASE_URL}" >> "$GITHUB_ENV"

                  bun run preview:static -- \
                    --listen "tcp://127.0.0.1:${A11Y_PORT}" \
                    --no-port-switching \
                    --no-clipboard \
                    > /tmp/serve.log 2>&1 &
                  echo $! > /tmp/serve.pid

                  for _ in $(seq 1 20); do
                    if curl -fsS "${A11Y_BASE_URL}/" > /dev/null; then
                      exit 0
                    fi
                    sleep 1
                  done

                  cat /tmp/serve.log
                  exit 1

            - name: Run axe-core (WCAG 2 A + AA)
              run: |
                  bunx --bun @axe-core/cli \
                    --chromedriver-path "${CHROMEWEBDRIVER}/chromedriver" \
                    "${A11Y_BASE_URL}/" \
                    "${A11Y_BASE_URL}/terms" \
                    "${A11Y_BASE_URL}/privacy/healpen" \
                    --tags wcag2a,wcag2aa --exit

            - name: Stop preview server
              if: always()
              run: |
                  if [ -f /tmp/serve.pid ]; then
                    kill "$(cat /tmp/serve.pid)" || true
                  fi

    preview:
        name: Preview Deploy
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        needs: build
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: read
            pull-requests: write
            checks: write
        # Exposes the Firebase preview channel URL as a job output so
        # downstream jobs (Lighthouse) can audit the real deployed
        # surface — including server routes like `/api/content/*` —
        # instead of a static dir that 404s on every dynamic endpoint.
        # `urls` output is a JSON-encoded array (e.g. `["https://...web.app"]`)
        # set unconditionally by the action; `details_url` came back
        # empty on a prior run at this SHA so we extract from `urls`
        # explicitly.
        outputs:
            preview_url: ${{ steps.resolved_preview_url.outputs.url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Download Build Artifact
              id: build-artifact
              continue-on-error: true
              uses: actions/download-artifact@v5
              with:
                  name: build-output
                  path: .output

            - name: Setup toolchain
              uses: ./.github/actions/setup-bun

            - name: Install SOPS
              run: |
                  curl -fsSL -o /tmp/sops.deb https://github.com/getsops/sops/releases/download/v3.13.3/sops_3.13.3_amd64.deb
                  sudo dpkg -i /tmp/sops.deb
                  sops --version

            - name: Build static output (artifact fallback)
              if: steps.build-artifact.outcome != 'success'
              run: |
                  set -a
                  source <(sops -d --output-type dotenv .env.shared.sops.yaml)
                  set +a
                  bun run build
              env:
                  NUXT_PUBLIC_APP_ENV: staging
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

            # The Firebase Hosting service-account key lives in the repo as a
            # SOPS+age file (secrets/firebase-service-account.sops.yaml). Decrypt
            # it here, mask every line, and hand it to the deploy action as a
            # step output. `project_id` stays unmasked: it's public (hardcoded
            # as `projectId` below), and masking it makes GitHub drop the
            # `preview_url` job output, which skips the Lighthouse audit.
            - name: Decrypt Firebase service account (SOPS + age)
              id: creds
              env:
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
              run: |
                  set -euo pipefail
                  SA_JSON=$(sops -d --extract '["service_account_json"]' secrets/firebase-service-account.sops.yaml)
                  echo "::add-mask::$SA_JSON"
                  printf '%s' "$SA_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);for (const [k,v] of Object.entries(j)) if (k!=="project_id") for (const l of String(v).split("\n")) if (l.trim()) console.log("::add-mask::"+l);});'
                  {
                    echo "json<<SA_EOF"
                    echo "$SA_JSON"
                    echo "SA_EOF"
                    echo "present=true"
                  } >> "$GITHUB_OUTPUT"

            - name: Deploy Preview to Firebase
              id: deploy
              if: steps.creds.outputs.present == 'true'
              uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0
              with:
                  repoToken: ${{ secrets.GITHUB_TOKEN }}
                  firebaseServiceAccount: ${{ steps.creds.outputs.json }}
                  # Project ID hardcoded rather than read from secrets —
                  # the value is public (it's literally in every preview
                  # URL the Firebase action posts on each PR), and using
                  # `secrets.FIREBASE_PROJECT_ID` causes GH Actions to
                  # redact `personal-website-v1-f775a` from this job's
                  # outputs. The `urls` output then arrives at the
                  # downstream Lighthouse job as `[]` and lhci fails with
                  # `No URLs provided to collect`. See PR #124 failed
                  # run in the previous private repository.
                  projectId: personal-website-v1-f775a
                  channelId: pr-${{ github.event.pull_request.number }}
                  expires: 7d

            - name: Publish preview URL for downstream jobs
              id: resolved_preview_url
              if: steps.creds.outputs.present == 'true'
              env:
                  # `urls` is a JSON array like ["https://…--pr-1-abc123.web.app"].
                  # Read it from the environment: pasted into a quoted shell
                  # argument, its inner quotes are stripped and JSON.parse fails.
                  # The channel URL ends in a random suffix, so there is no
                  # URL to guess if the action returns none.
                  URLS: ${{ steps.deploy.outputs.urls }}
                  DETAILS_URL: ${{ steps.deploy.outputs.details_url }}
              run: |
                  URL=$(node -e 'try{const u=JSON.parse(process.env.URLS||"[]");process.stdout.write(u[0]||"")}catch{}')
                  if [ -z "$URL" ]; then URL="$DETAILS_URL"; fi
                  if [ -z "$URL" ]; then
                    echo "::error::The Firebase deploy step returned no preview URL."
                    exit 1
                  fi
                  echo "Preview: $URL"
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
